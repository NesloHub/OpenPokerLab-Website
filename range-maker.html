<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Range Maker | OpenPokerLab</title>
    <meta name="description" content="Build, save, and load your own custom poker ranges with our free interactive GTO matrix tool.">
    
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://openpokerlab.org/range-maker.html">
    <meta property="og:title" content="OpenPokerLab | Range Maker">
    <meta property="og:description" content="Build, save, and load your own custom poker ranges.">
    <meta property="og:image" content="https://openpokerlab.org/og-image.png">

    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="favicon.png">

    <style>
        .maker-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px 20px 80px 20px;
        }

        .maker-card {
            background: #111;
            border-top: 5px solid var(--neon-green);
            padding: 40px;
            border-radius: 6px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Stats Panel */
        .stats-panel {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-bottom: 30px;
            background: #0a0a0a;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #222;
            width: 100%;
            max-width: 600px;
        }

        .stat-box {
            text-align: center;
        }

        .stat-label {
            color: #888;
            font-size: 0.85rem;
            letter-spacing: 2px;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .stat-value {
            color: #fff;
            font-size: 2rem;
            font-weight: 600;
            font-family: monospace;
        }
        
        .stat-value.highlight {
            color: var(--neon-green);
        }

        /* Matrixen */
        .range-matrix-container {
            width: 100%;
            max-width: 600px;
            margin-bottom: 40px;
        }

        .poker-grid {
            display: grid;
            grid-template-columns: repeat(13, 1fr);
            gap: 1px;
            background-color: #333;
            border: 2px solid #333;
            border-radius: 4px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        .grid-cell {
            background-color: #0a0a0a;
            color: #555;
            font-size: 0.9rem;
            font-family: monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            aspect-ratio: 1; 
            user-select: none;
            cursor: pointer; /* Viser at de kan klikkes på */
            transition: background-color 0.1s ease;
        }

        .grid-cell:hover {
            background-color: #222;
            color: #fff;
        }

        .grid-cell.active {
            background-color: var(--neon-green);
            color: #000;
            font-weight: bold;
        }

        /* Action Knapper */
        .controls {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
        }

        .control-btn {
            background: #0a0a0a;
            color: #fff;
            border: 1px solid #444;
            padding: 12px 25px;
            font-family: var(--font-main);
            font-weight: 600;
            font-size: 0.9rem;
            letter-spacing: 2px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
        }

        .control-btn:hover {
            border-color: var(--neon-green);
            color: var(--neon-green);
            box-shadow: 0 0 15px rgba(57, 255, 20, 0.2);
        }

        .control-btn.danger:hover {
            border-color: #ff4d4d;
            color: #ff4d4d;
            box-shadow: 0 0 15px rgba(255, 77, 77, 0.2);
        }

        /* Skjult input til fil-upload */
        #file-upload {
            display: none;
        }

        @media (max-width: 600px) {
            .grid-cell { font-size: 0.6rem; }
            .stats-panel { flex-direction: column; gap: 20px; }
            .maker-card { padding: 20px; }
        }
    </style>
</head>
<body class="content-page">

    <div id="global-header"></div>
    <script src="menu.js"></script>

    <main class="strategy-main">
        <section class="page-header">
            <h1 class="elegant-title-small">RANGE <span class="title-highlight">MAKER</span></h1>
            <p class="subtitle">Click the matrix to build your custom range. Save and load via JSON.</p>
        </section>

        <section class="maker-container">
            <div class="maker-card">
                
                <!-- Stats / Udregner -->
                <div class="stats-panel">
                    <div class="stat-box">
                        <div class="stat-label">Hands Selected</div>
                        <div class="stat-value highlight" id="stat-percent">0.0%</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-label">Combos</div>
                        <div class="stat-value" id="stat-combos">0 / 1326</div>
                    </div>
                </div>

                <!-- Matrixen -->
                <div class="range-matrix-container" id="interactive-matrix"></div>

                <!-- Knapper (Save, Load, Clear) -->
                <div class="controls">
                    <button class="control-btn danger" onclick="clearGrid()">Clear Grid</button>
                    
                    <button class="control-btn" onclick="document.getElementById('file-upload').click()">
                        Load JSON
                    </button>
                    <input type="file" id="file-upload" accept=".json" onchange="loadRange(event)">
                    
                    <button class="control-btn" onclick="saveRange()">Save as JSON</button>
                </div>

            </div>
        </section>
    </main>

    <div id="global-footer"></div>

    <!-- JAVASCRIPT TIL INTERAKTIVITET OG JSON -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const ranks = ['A','K','Q','J','T','9','8','7','6','5','4','3','2'];
            const container = document.getElementById('interactive-matrix');
            
            let html = '<div class="poker-grid">';
            
            // Tegn matrixen
            for(let r=0; r<13; r++) {
                for(let c=0; c<13; c++) {
                    let cellHand = '';
                    let comboCount = 0;

                    if(r === c) {
                        cellHand = ranks[r] + ranks[c]; // Pocket Pairs
                        comboCount = 6;
                    } else if(r < c) {
                        cellHand = ranks[r] + ranks[c] + 's'; // Suited
                        comboCount = 4;
                    } else {
                        cellHand = ranks[c] + ranks[r] + 'o'; // Offsuit
                        comboCount = 12;
                    }

                    html += \`<div class="grid-cell" data-hand="\${cellHand}" data-combos="\${comboCount}">\${cellHand}</div>\`;
                }
            }
            html += '</div>';
            container.innerHTML = html;

            // Gør cellerne klikbare (Toggle Active)
            const cells = document.querySelectorAll('.grid-cell');
            cells.forEach(cell => {
                cell.addEventListener('click', function() {
                    this.classList.toggle('active');
                    updateStats();
                });
            });
        });

        // Opdater procenter og combos
        function updateStats() {
            let selectedCombos = 0;
            const totalCombos = 1326;
            
            document.querySelectorAll('.grid-cell.active').forEach(cell => {
                selectedCombos += parseInt(cell.getAttribute('data-combos'));
            });

            const percent = ((selectedCombos / totalCombos) * 100).toFixed(1);
            
            document.getElementById('stat-combos').innerText = selectedCombos + " / " + totalCombos;
            document.getElementById('stat-percent').innerText = percent + "%";
        }

        // Ryd hele pladen
        function clearGrid() {
            document.querySelectorAll('.grid-cell').forEach(cell => {
                cell.classList.remove('active');
            });
            updateStats();
        }

        // Eksporter til JSON fil
        function saveRange() {
            const activeCells = document.querySelectorAll('.grid-cell.active');
            if(activeCells.length === 0) {
                alert("Please select some hands before saving!");
                return;
            }

            const hands = Array.from(activeCells).map(cell => cell.getAttribute('data-hand'));
            
            const data = {
                title: "Custom Range - OpenPokerLab",
                date: new Date().toISOString(),
                hands: hands
            };

            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(data, null, 2));
            const downloadAnchorNode = document.createElement('a');
            downloadAnchorNode.setAttribute("href", dataStr);
            downloadAnchorNode.setAttribute("download", "my_poker_range.json");
            document.body.appendChild(downloadAnchorNode);
            downloadAnchorNode.click();
            downloadAnchorNode.remove();
        }

        // Importer fra JSON fil
        function loadRange(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    if(!data.hands || !Array.isArray(data.hands)) {
                        alert("Invalid JSON format. Cannot load range.");
                        return;
                    }

                    // Ryd pladen først
                    clearGrid();

                    // Slå de importerede hænder til
                    data.hands.forEach(hand => {
                        const cell = document.querySelector(\`.grid-cell[data-hand="\${hand}"]\`);
                        if(cell) {
                            cell.classList.add('active');
                        }
                    });

                    updateStats();
                } catch(error) {
                    alert("Error reading JSON file.");
                }
            };
            reader.readAsText(file);
            
            // Nulstil fil-input så man kan vælge den samme fil igen senere hvis man vil
            event.target.value = '';
        }
    </script>

</body>
</html>
